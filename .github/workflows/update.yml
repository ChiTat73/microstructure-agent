name: Scheduled Microstructure Update

on:
  schedule:
    # Runs daily at 00:00 UTC (8:00 AM HKT)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Tracker Script
        run: python frontend/tracker.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data.json
          git commit -m "Auto-update APAC microstructure market data" || exit 0
          git push
