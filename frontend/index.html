    <script>
        async function renderLedgerMatrix() {
            try {
                const response = await fetch(window.location.origin + window.location.pathname.replace('frontend/index.html', 'data.json'));

                const data = await response.json();

                // Synchronize global time parameter
                document.getElementById('sync-time').innerText = data.last_updated;

                const macroBody = document.getElementById('macro-ledger-body');
                const costBody = document.getElementById('cost-ledger-body');
                const rulesBody = document.getElementById('rules-ledger-body');

                // Clear previous rows to handle updates smoothly
                macroBody.innerHTML = "";
                costBody.innerHTML = "";
                rulesBody.innerHTML = "";

                data.markets.forEach(m => {
                    // Automatically assign tag badge styling based on market type
                    const classTag = m.classification === "DEVELOPED MKT" ? "tag-dev" : "tag-dev style='border-color:#4c1d95; color:#c084fc;'";
                    
                    // Inject Row 1: Macro Turnover Specs Ledger
                    macroBody.innerHTML += `
                        <tr>
                            <td><span class="mkt-badge">${m.code}</span></td>
                            <td style="color:#ffffff; font-weight:500;">${m.country}</td>
                            <td><span class="tag ${classTag}">${m.classification}</span></td>
                            <td>
                                <div class="highlight-text">${m.turnover_local}</div>
                                <div style="color:#64748b; font-size:11px; margin-top:2px;">${m.turnover_usd}</div>
                            </td>
                            <td class="tag-concentrator">
                                <span class="neon-blue">${m.pillar_sector}</span> • ${m.volume_concentrator}
                            </td>
                        </tr>
                    `;

                    // Inject Row 2: TCA Cost Matrix Ledger
                    costBody.innerHTML += `
                        <tr>
                            <td><span class="mkt-badge">${m.code}</span></td>
                            <td class="neon-green" style="font-family:monospace;">${m.avg_spread}</td>
                            <td class="neon-amber" style="font-family:monospace;">${m.slippage}</td>
                            <td style="color:#ffffff; font-family:monospace;">${m.off_exchange_pct}</td>
                            <td style="color:#94a3b8;">${m.trader_advisory}</td>
                        </tr>
                    `;

                    // Inject Row 3: Automated Agent Routing Constraints Ledger
                    rulesBody.innerHTML += `
                        <tr>
                            <td><span class="mkt-badge">${m.code}</span></td>
                            <td class="neon-red" style="font-family:monospace;">${m.safeguard}</td>
                            <td style="color:#ffffff;">${m.lot_size}</td>
                            <td class="purple-text">${m.queue_rule}</td>
                        </tr>
                    `;
                });

            } catch (err) {
                console.error("Dashboard dataset pipeline sync failure:", err);
            }
        }
        window.addEventListener('DOMContentLoaded', renderLedgerMatrix);
    </script>
